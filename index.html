<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Çivili Futbol</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js" defer></script>
    <script src="game.js" defer></script>
</head>
    
<body>

    <!-- ===== ANA MENÜ ===== -->
    <div id="menu">

        <div class="input-group">
            <div class="input-wrapper">
                <div class="logo-container">
                    <img src="butonlar/logo-alani.webp" alt="Logo" class="input-logo">
                    <img id="selected-team-logo-display" src="takimlar/default.png" alt="Takım Logosu" class="team-logo-overlay">
                </div>
                <img src="butonlar/ismini-gir.webp" alt="İsmini Gir" class="input-icon">
                <input type="text" id="player-name" value="Oyuncu" maxlength="12">
            </div>
        </div>

        <!-- TAKIM SEÇ BUTONU (GÜNCELLENDİ) -->
<button class="menu-btn" onclick="openTeamSelectPopup()">
    <img src="butonlar/takim-sec.webp" alt="TAKIM SEÇ" class="menu-btn-img">
</button>

        <button class="menu-btn" onclick="openAILevelMenu()">
            <img src="butonlar/bilgisayara-karsi.webp" alt="BİLGİSAYARA KARŞI" class="menu-btn-img">
        </button>
        
        <button class="menu-btn" onclick="openLocalTeamSelect()">
            <img src="butonlar/2kisi-ayni-ekran.webp" alt="2 KİŞİLİK AYNI EKRAN" class="menu-btn-img">
        </button>
        
        <button class="menu-btn" onclick="openOnlineLobby()">
            <img src="butonlar/online-mac.png" alt="ONLINE MAÇ" class="menu-btn-img">
        </button>

        <button class="menu-btn settings-btn" onclick="openSettingsPopup()">
            <img src="butonlar/ayarlar.webp" alt="AYARLAR" class="menu-btn-img">
        </button>

    </div>
<!-- Diğer tüm oyun kodlarınız, ana menünüz, canvas'ınız vb. burada -->

       <!-- ============================================================
         AYARLAR POP-UP
         ============================================================ -->
    <div id="settings-popup" style="display: none;" onclick="if(event.target===this) closeSettingsPopup()">
        <div class="popup-content settings-popup-content">
            <img src="menu/ayarlar/arkafon.webp" alt="Ayarlar" class="settings-bg">
            <div class="settings-buttons-container">
                
                <!-- MAÇ SÜRESİ (AKTİF) -->
<div class="settings-row">
    <div class="settings-match-container">
        <div class="settings-match-header" onclick="toggleMatchDurationOptions()">
            <div class="settings-match-wrapper">
                <img src="menu/ayarlar/mac suresi.webp" alt="Maç Süresi" class="settings-btn-img">
                <span class="settings-selected-value" id="match-duration-display">90sn</span>
            </div>
            <span class="settings-arrow">▼</span>
        </div>
        <div class="settings-match-options" id="match-duration-options" style="display: none;">
            <button class="settings-option" data-duration="60" onclick="setMatchDuration(60)">60sn</button>
            <button class="settings-option active" data-duration="90" onclick="setMatchDuration(90)">90sn</button>
            <button class="settings-option" data-duration="120" onclick="setMatchDuration(120)">120sn</button>
            <button class="settings-option" data-duration="150" onclick="setMatchDuration(150)">150sn</button>
        </div>
    </div>
</div>
               <!-- VURUŞ SÜRESİ (AKTİF) -->
<div class="settings-row">
    <div class="settings-shot-container settings-match-container">
        <div class="settings-match-header" onclick="toggleShotDurationOptions()">
            <div class="settings-match-wrapper settings-shot-wrapper">
                <img src="menu/ayarlar/vurus suresi.webp" alt="Vuruş Süresi" class="settings-btn-img">
                <span class="settings-selected-value" id="shot-duration-display">5sn</span>
            </div>
            <span class="settings-arrow">▼</span>
        </div>
        <div class="settings-match-options" id="shot-duration-options" style="display: none;">
            <button class="settings-option" data-shot-duration="3" onclick="setShotDuration(3)">3sn</button>
            <button class="settings-option active" data-shot-duration="5" onclick="setShotDuration(5)">5sn</button>
            <button class="settings-option" data-shot-duration="7" onclick="setShotDuration(7)">7sn</button>
        </div>
    </div>
</div>
                
                <!-- STADYUM SEÇİMİ -->
<div class="settings-row">
    <div class="settings-match-container">
        <!-- Ana Buton & Seçili Görsel Önizlemesi -->
        <div class="settings-match-header" onclick="toggleStadiumOptions()">
            <div class="settings-match-wrapper">
                <img src="menu/ayarlar/stadyum.webp" alt="Stadyum Seç" class="settings-btn-img">
                <!-- Seçilen görsel butonun yanında mini önizleme olarak görünecek -->
                <img src="menu/ayarlar/stat/z1.webp" id="selected-stadium-preview" class="stadium-preview-icon" alt="Seçili Zemin">
            </div>
            <span class="settings-arrow">▼</span>
        </div>

        <!-- Seçenekler Menüsü (Tıklanınca Açılan Ufak Resim Dizilimi) -->
        <div class="settings-match-options stadium-options-grid" id="stadium-options" style="display: none;">
            <div class="stadium-option-card active" onclick="selectStadium('z1', 'menu/ayarlar/stat/texure/z1-t.webp')">
                <img src="menu/ayarlar/stat/z1.webp" alt="Zemin 1">
            </div>
            <div class="stadium-option-card" onclick="selectStadium('z2', 'menu/ayarlar/stat/texure/z2-t.webp')">
                <img src="menu/ayarlar/stat/z2.webp" alt="Zemin 2">
            </div>
            <div class="stadium-option-card" onclick="selectStadium('z3', 'menu/ayarlar/stat/texure/z3-t.webp')">
                <img src="menu/ayarlar/stat/z3.webp" alt="Zemin 3">
            </div>
            <div class="stadium-option-card" onclick="selectStadium('z4', 'menu/ayarlar/stat/texure/z4-t.webp')">
                <img src="menu/ayarlar/stat/z4.webp" alt="Zemin 4">
            </div>
            <div class="stadium-option-card" onclick="selectStadium('z5', 'menu/ayarlar/stat/texure/z5-t.webp')">
                <img src="menu/ayarlar/stat/z5.webp" alt="Zemin 5">
            </div>
        </div>
    </div>
</div>
                
           <!-- SES (AKTİF) -->
<img src="menu/ayarlar/ses.webp" alt="Ses" class="settings-btn-img" id="sound-toggle-btn" onclick="toggleSound()" style="cursor:pointer;">
                         
                <!-- ANA MENÜ -->
                <img src="menu/ayarlar/ana menu.webp" alt="Ana Menü" class="settings-btn-img" onclick="closeSettingsPopup()">
                
            </div>
        </div>
    </div>

    <!-- ============================================================
         AI ZORLUK POP-UP
         ============================================================ -->
    <div id="ai-level-menu" style="display: none;">
        <div class="popup-content difficulty-popup">
            <div class="difficulty-container">
                <img src="menu/zorluk/zorluk-secimi.webp" alt="Zorluk Seçimi" class="difficulty-bg">
                
                <div class="difficulty-btn-area" style="position:absolute; top:40%; left:50%; transform:translateX(-50%); width:60%; cursor:pointer;" onclick="selectDifficulty('kolay')">
                    <img src="menu/zorluk/kolay.webp" alt="Kolay" style="width:100%; display:block; pointer-events:none;">
                </div>
                
                <div class="difficulty-btn-area" style="position:absolute; top:52%; left:50%; transform:translateX(-50%); width:60%; cursor:pointer;" onclick="selectDifficulty('orta')">
                    <img src="menu/zorluk/orta.webp" alt="Orta" style="width:100%; display:block; pointer-events:none;">
                </div>
                
                <div class="difficulty-btn-area" style="position:absolute; top:64%; left:50%; transform:translateX(-50%); width:60%; cursor:pointer;" onclick="selectDifficulty('zor')">
                    <img src="menu/zorluk/zor.webp" alt="Zor" style="width:100%; display:block; pointer-events:none;">
                </div>
                
                <div class="difficulty-btn-area" style="position:absolute; top:76%; left:50%; transform:translateX(-50%); width:60%; cursor:pointer;" onclick="selectDifficulty('usta')">
                    <img src="menu/zorluk/usta.webp" alt="Usta" style="width:100%; display:block; pointer-events:none;">
                </div>
                
                <div class="difficulty-btn-area" style="position:absolute; bottom:1%; left:50%; transform:translateX(-50%); width:35%; cursor:pointer;" onclick="closeAILevelMenu()">
                    <img src="menu/zorluk/ana menu.webp" alt="Geri" style="width:100%; display:block; pointer-events:none;">
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================
         ONLINE LOBI POP-UP
         ============================================================ -->
    <div id="online-lobby" style="display: none;" onclick="if(event.target===this) closeOnlineLobby()">
        <div class="popup-content">
            <div class="popup-header">
                <h2>ONLINE HAVUZ</h2>
                <button class="popup-close" onclick="closeOnlineLobby()">✕</button>
            </div>
            <div class="popup-body">
                <p style="font-size: 11px; color: #ccc; margin-bottom: 10px;">Maç yapmak istediğiniz kişiye tıklayarak davet gönderin</p>
                <div class="player-list" id="lobby-list">
                    <div style="padding:15px;color:#888;text-align:center;">Havuz güncelleniyor...</div>
                </div>
            </div>
        </div>
    </div>

   <!-- ============================================================
         2 KİŞİLİK TAKIM SEÇ POP-UP (YENİ ARKA FONLU TASARIM)
         ============================================================ -->
    <div id="local-team-select" style="display: none;">
        <div class="local-team-container">
            <!-- Arka Fon Görseli -->
            <img src="menu/2kisilik/2kisilikarkafon.webp" alt="2 Kişilik Arka Fon" class="local-team-bg">
            
            <!-- Seçilen Takımlar Önizleme / Shield Alanları -->
            <div class="local-selected-area p1-selected-area">
                <img id="local-p1-shield-img" src="" alt="P1 Takım" style="display: none;">
            </div>
            <div class="local-selected-area p2-selected-area">
                <img id="local-p2-shield-img" src="" alt="P2 Takım" style="display: none;">
            </div>

            <!-- Takım Seçim Izgaraları -->
            <div class="local-team-body">
                <div class="local-player-section">
                    <div class="team-logo-options" id="local-player1-logos"></div>
                </div>
                <div class="local-player-section">
                    <div class="team-logo-options" id="local-player2-logos"></div>
                </div>
            </div>

            <!-- Alt Butonlar (Yan Yana ve Aynı Hizada) -->
            <div class="local-action-buttons">
                <div class="local-btn local-start-btn" onclick="startLocalGameWithTeams()">
                    <img src="menu/2kisilik/macabasla.webp" alt="Maça Başla">
                </div>
                <div class="local-btn local-main-menu-btn" onclick="closeLocalTeamSelect()">
                    <img src="menu/ayarlar/ana menu.webp" alt="Ana Menü">
                </div>
            </div>

    <!-- ============================================================
         OYUN EKRANI
         ============================================================ -->
    <div id="top-bar" style="display: none;">
        <div class="hud-row">
            <button id="exit-btn" onclick="exitToMenu()">✕</button>
            <div id="score-board">
                <div class="team-score">
                    <img id="score-logo-p1" src="takimlar/default.png" alt="Takım 1" class="score-logo">
                    <span id="score-p1">0</span>
                </div>
                <span id="score-divider">-</span>
                <div class="team-score">
                    <span id="score-p2">0</span>
                    <img id="score-logo-p2" src="takimlar/default.png" alt="Takım 2" class="score-logo">
                </div>
            </div>
            <div id="time-board">90s</div>
        </div>
        <div class="hud-row-second">
            <div id="turn-indicator">Diziliş</div>
            <div id="shot-timer">ŞUT: 5s</div>
        </div>
    </div>

    <!-- ============================================================
         CANVAS VE BUTON
         ============================================================ -->
    <div class="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <button id="start-match-btn" onclick="confirmFormationsAndStart()">BAŞLAT</button>
    </div>

    <!-- ============================================================
         GÜÇ GÖSTERGESİ
         ============================================================ -->
    <div id="power-bar-container">
        <div id="power-bar"></div>
    </div>

</body><!-- Ana menü, butonlar, input alanları vs. hepsi burada bitti -->
        
    </div> <!-- Varsa ana container kapanışı -->

   <!-- ============================================================
     TAKIM SEÇİM POP-UP (HER ŞEYİN DIŞINDA VE EN ALTTA OLMALI)
     ============================================================ -->
<div id="team-select-popup" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999999; background: #000;">
    <div class="team-select-container">
        <img src="menu/takimsec/takimsecarkafon.webp" alt="Takım Seç" class="team-select-bg">
        <div class="selected-team-shield-area">
            <img id="popup-selected-team-img" src="" alt="Seçilen Takım" style="display: none;">
        </div>
        <div class="team-select-grid" id="team-select-grid"></div>
        <div class="team-select-main-menu-btn" onclick="closeTeamSelectPopup()">
            <img src="menu/ayarlar/ana menu.webp" alt="Ana Menü">
        </div>
    </div>
</div>
